<!-- RENEVATIO controls mount; Footer Code Injection. -->
<style>
.rv-controls-shell[data-rv-mount="controls"] {
  position: relative;
  z-index: 20;
  display: block;
  width: 100%;
  height: clamp(52px, 18vw, 68px);
  max-width: 100%;
  margin-inline: auto;
  padding: 0;
  overflow: visible;
  background: transparent;
}
.rv-controls-shell[data-rv-mount="controls"] > iframe {
  position: absolute;
  top: 0;
  left: 0;
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
  transition: height .18s ease;
}
.rv-controls-shell[data-rv-mount="controls"][data-rv-collapsed="false"] {
  z-index: 2147483000;
}
.rv-controls-shell[data-rv-mount="controls"][data-rv-collapsed="false"] > iframe {
  height: min(460px, 115vw);
}
@media (max-width: 639px) {
  .rv-controls-shell[data-rv-mount="controls"] {
    height: 52px;
  }
  .rv-controls-shell[data-rv-mount="controls"][data-rv-collapsed="false"] > iframe {
    height: 232px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .rv-controls-shell[data-rv-mount="controls"] > iframe { transition: none; }
}
</style>
<script>
(() => {
  if (window.__rvControlsMountV3) return;
  window.__rvControlsMountV3 = true;
  const src = 'https://renevatiostudio.github.io/renevatio-column-embed/background/controls.html?v=4';
  const selector = '.rv-controls-shell[data-rv-mount="controls"]';

  function mount(root) {
    if (root.dataset.rvMounted === 'true') return;
    root.dataset.rvMounted = 'true';
    root.dataset.rvCollapsed = 'true';
    const frame = document.createElement('iframe');
    frame.src = src;
    frame.title = 'RENEVATIO controls';
    frame.loading = 'eager';
    root.append(frame);
  }
  function scan(scope = document) {
    if (scope.matches?.(selector)) mount(scope);
    scope.querySelectorAll?.(selector).forEach(mount);
  }
  function start() {
    scan();
    window.addEventListener('message', event => {
      if (event.data?.rv !== 'controls-layout-v1') return;
      document.querySelectorAll(selector).forEach(root => {
        const frame = root.querySelector('iframe');
        if (frame && event.source === frame.contentWindow) {
          root.dataset.rvCollapsed = String(Boolean(event.data.collapsed));
        }
      });
    });
    new MutationObserver(records => records.forEach(record =>
      record.addedNodes.forEach(node => node.nodeType === 1 && scan(node))
    )).observe(document.documentElement, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, { once: true });
  } else start();
})();
</script>
<!-- Keep the existing background bridge loaded once, after both roots mount. -->
